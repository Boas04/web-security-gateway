services:
  portal:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE: /app/data/portal.db
      RATE_LIMIT: "120"
    volumes:
      - portal-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  portal-data:
