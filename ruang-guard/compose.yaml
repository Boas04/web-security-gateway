name: ruang-guard
x-guard: &guard
  build: .
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment:
    DATABASE: /data/guard.db
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8090}
    ALERT_BLOCK_THRESHOLD: ${ALERT_BLOCK_THRESHOLD:-30}
    ALERT_WINDOW_SECONDS: ${ALERT_WINDOW_SECONDS:-60}
    ALERT_FAILURE_COUNT: ${ALERT_FAILURE_COUNT:-2}
  volumes:
    - guard-data:/data
    - ./config/origins.json:/app/config/origins.json:ro
  secrets: [session_key]
  mem_limit: 256m
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}
services:
  gateway:
    <<: *guard
    # Host port differs from the unchanged gateway container listener.
    ports: ["127.0.0.1:8090:8080"]
    networks: [edge, inspection, origin]
    depends_on: [waf, portal]
  admin:
    <<: *guard
    command: ["waitress-serve", "--listen=0.0.0.0:9000", "--threads=4", "--connection-limit=50", "--max-request-body-size=4096", "--max-request-header-size=8192", "--channel-timeout=15", "--call", "guard.admin:create_app"]
    ports: ["127.0.0.1:9000:9000"]
    networks: [admin]
    secrets: [session_key, admin_hash]
  monitor:
    <<: *guard
    command: ["python", "-m", "guard.monitor"]
    networks: [origin, inspection]
    depends_on: [portal, waf]
  waf:
    build: ./waf
    networks: [inspection]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
  ml-worker:
    <<: *guard
    build:
      context: .
      dockerfile: Dockerfile.ml
    command: ["python", "-m", "guard.ml_worker"]
    environment:
      DATABASE: /data/guard.db
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    networks: [analysis]
    cpus: 1.0
    mem_limit: 512m
  portal:
    build: ../ruang-warga
    environment:
      DATABASE: /app/data/portal.db
      RATE_LIMIT: "10000"
    volumes: [portal-data:/app/data]
    networks:
      origin:
        ipv4_address: 172.30.10.10
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
  demo-app:
    profiles: [demo]
    build: ./demo-app
    networks:
      origin:
        ipv4_address: 172.30.10.20
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
networks:
  analysis:
    internal: true
  edge: {}
  admin: {}
  inspection:
    internal: true
  origin:
    internal: true
    ipam:
      config: [{subnet: 172.30.10.0/24}]
volumes:
  guard-data:
  portal-data:
secrets:
  session_key:
    file: ./secrets/session_key
  admin_hash:
    file: ./secrets/admin_hash
