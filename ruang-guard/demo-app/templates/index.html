<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katalog Lab</title><link rel="stylesheet" href="/static/catalog.css"></head><body><main><p>APLIKASI DEMONSTRASI LOKAL</p><h1>Katalog Lab</h1><p>Katalog barang fiktif untuk pengujian integrasi Ruang Guard.</p><form method="get"><label for="q">Cari barang</label><input id="q" name="q" maxlength="100" value="{{ query }}"><button>Cari</button></form><table><thead><tr><th>ID</th><th>Nama</th><th>Kategori</th></tr></thead><tbody>{% for item in items %}<tr><td>{{ item.id }}</td><td>{{ item.name }}</td><td>{{ item.category }}</td></tr>{% else %}<tr><td colspan="3">Tidak ada barang yang cocok.</td></tr>{% endfor %}</tbody></table></main></body></html>
